<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inline and Internal CSS</title>
<style>
    h1 {
        color: navy;
    }

    .highlight {
        background-color: yellow;
    }
</style>
</head>
<body>
<h1>CSS Fundamentals</h1>
<p style="color: red;">This paragraph uses an inline style.</p>
<p class="highlight">This paragraph uses the highlight class.</p>
</body>
</html>
